<!DOCTYPE html>
<html lang="de">
<head>
<!-- Monitor 2 – Speisekarte (Display-Seite für 32-Zoll-Full-HD, 1920 × 1080).
     Normalbetrieb: links eine ruhige Bildfolge der Gerichte (ein großes Foto, alle 8 s langsam überblenden),
     rechts die Karte. Lasagne (Menüeintrag UND Foto) nur an Tagen, an denen sie angeboten wird – entschieden
     zentral in /monitor/lasagne.js.
     „Kleines Bistro“ (Schalter in der Verwaltung von Monitor 4): eigenes, ruhiges Layout mit dem reduzierten
     Sortiment. Ein Foto von Brezel, Cookies oder Eis gibt es noch nicht – deshalb nur das Wrap-Foto.
     Namen, Preise, Kategorien und Fotos stehen nur in /daten/speisen.js (dieselben Daten wie die Startseite). -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Speisekarte – Tjorven Bistro</title>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/fontin-sans">
<link rel="stylesheet" href="/monitor/monitor.css">
<link rel="stylesheet" href="/monitor/speisen/speisen.css">
<script src="/monitor/buehne.js"></script>
<script type="module" src="/monitor/speisen/speisen.js"></script>
</head>
<body>
<main class="buehne speisen">
  <header class="kopf">
    <h1>Speisekarte</h1>
    <img class="logo" src="/images/tjorven-logo-gruen.png" alt="Tjorven Bistro">
  </header>
  <div class="trenner"></div>

  <!-- Normalbetrieb: Bildfolge und Karte – Inhalt kommt aus /daten/speisen.js (speisen.js baut sie auf) -->
  <div class="inhalt modus" id="normal">
    <div class="diashow" id="diashow"></div>
    <div class="karte" id="karte"></div>
  </div>

  <!-- Kleines Bistro / reduziertes Angebot: eigene, größere Karte (ebenfalls aus /daten/speisen.js) -->
  <div class="inhalt klein modus" id="klein" hidden>
    <div class="diashow" id="diashowKlein"></div>
    <div class="karte" id="karteKlein"></div>
  </div>
</main>
</body>
</html>
