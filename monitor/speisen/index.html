<!DOCTYPE html>
<html lang="de">
<head>
<!-- Monitor 2 – Speisekarte (Display-Seite für 32-Zoll-Full-HD, 1920 × 1080).
     Statisch: keine Animation, kein Bildwechsel. Logik: Lasagne (Menüeintrag + Bildkachel) nur an
     Tagen, an denen sie angeboten wird – entschieden zentral in /monitor/lasagne.js. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Speisekarte – Tjorven Bistro</title>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/fontin-sans">
<link rel="stylesheet" href="/monitor/monitor.css">
<link rel="stylesheet" href="/monitor/speisen/speisen.css">
<script src="/monitor/buehne.js"></script>
<script type="module" src="/monitor/speisen/speisen.js"></script>
</head>
<body>
<main class="buehne speisen">
  <header class="kopf">
    <h1>Speisekarte</h1>
    <img class="logo" src="/images/tjorven-logo-gruen.png" alt="Tjorven Bistro">
  </header>
  <div class="trenner"></div>

  <div class="inhalt">
    <!-- Bildkacheln: Foto oben, darunter eine eigene grüne Beschriftungsfläche mit Name und Preis
         (wie beim Abholmonitor). Ohne Lasagne 5 Kacheln (Bowl groß), mit Lasagne 6 Kacheln (2 × 3). -->
    <div class="kacheln" id="bilder">
      <figure class="kachel k-bowl"><div class="bild"><img class="foto" src="/images/abholmonitor/13-saisonale-bowl-quer.jpeg" alt="Tjorvens saisonale Bowl"></div><figcaption class="beschriftung"><span class="k-name">Bowl</span><span class="k-preis" data-artikel="Bowl">13.5</span></figcaption></figure>
      <figure class="kachel k-lasagne" data-nur-mit-lasagne hidden><div class="bild"><img class="foto" src="/images/abholmonitor/35-lasagne-neu-quer.jpeg" alt="Hausgemachte Lasagne mit Beilagensalat"></div><figcaption class="beschriftung"><span class="k-name">Lasagne</span><span class="k-preis" data-artikel="Lasagne">12.5</span></figcaption></figure>
      <figure class="kachel k-focaccia"><div class="bild"><img class="foto" src="/images/abholmonitor/12-focaccia-quer.jpeg" alt="Saisonales Focaccia"></div><figcaption class="beschriftung"><span class="k-name">Focaccia</span><span class="k-preis" data-artikel="Focaccia">5.5</span></figcaption></figure>
      <figure class="kachel k-wrap"><div class="bild"><img class="foto" src="/images/abholmonitor/09-wrap-gemuese-quer.jpeg" alt="Getoasteter Wrap"></div><figcaption class="beschriftung"><span class="k-name">Wrap</span><span class="k-preis" data-artikel="Wrap">8.0</span></figcaption></figure>
      <figure class="kachel k-pommes"><div class="bild"><img class="foto" src="/images/abholmonitor/23-pommes-service-hochkant.jpeg" alt="Knusprige Pommes mit Dips"></div><figcaption class="beschriftung"><span class="k-name">Pommes</span><span class="k-preis" data-artikel="Pommes">4.5</span></figcaption></figure>
      <figure class="kachel k-waffel"><div class="bild"><img class="foto" src="/images/abholmonitor/18-waffel-puderzucker-quer.jpeg" alt="Hausgemachte Belgische Waffel mit Puderzucker"></div><figcaption class="beschriftung"><span class="k-name">Belgische Waffel</span><span class="k-preis" data-artikel="Belgische Waffel">4.5</span></figcaption></figure>
    </div>

    <div class="karte">
      <section class="gruppe">
        <h2>herzhaft</h2>
        <div class="zeile"><span class="name">Tjorvens saisonale Bowl</span><span class="fuell"></span><span class="preis" data-artikel="Tjorvens saisonale Bowl">13.5</span></div>
        <div class="zeile lasagne" data-nur-mit-lasagne hidden><span class="name">Hausgemachte Lasagne &amp; Beilagensalat</span><span class="fuell"></span><span class="preis" data-artikel="Hausgemachte Lasagne &amp; Beilagensalat">12.5</span></div>
        <div class="zeile"><span class="name">Knusprige Pommes</span><span class="fuell"></span><span class="preis" data-artikel="Knusprige Pommes">4.5</span></div>
        <div class="zeile"><span class="name">Loaded Pommes – Veggie oder BBQ</span><span class="fuell"></span><span class="preis" data-artikel="Loaded Pommes – Veggie oder BBQ">9.0</span></div>
        <div class="zeile"><span class="name">Saisonales Focaccia</span><span class="fuell"></span><span class="preis" data-artikel="Saisonales Focaccia">5.5</span></div>
        <div class="zeile"><span class="name">Bunter Blattsalat</span><span class="fuell"></span><span class="preis" data-artikel="Bunter Blattsalat">4.5</span></div>
        <div class="zeile"><span class="name">Getoasteter Wrap</span><span class="fuell"></span><span class="preis" data-artikel="Getoasteter Wrap">8.0</span></div>
      </section>
      <section class="gruppe">
        <h2>süß</h2>
        <div class="zeile"><span class="name">Hausgemachte Belgische Waffel</span><span class="fuell"></span><span class="preis" data-artikel="Hausgemachte Belgische Waffel">4.5</span></div>
        <div class="zeile"><span class="name">Homemade Cookies</span><span class="fuell"></span><span class="preis" data-artikel="Homemade Cookies">2.0</span></div>
        <div class="zeile"><span class="name">Eiscreme</span><span class="fuell"></span><span class="preis" data-artikel="Eiscreme">2.2 | 3.0</span></div>
      </section>
    </div>
  </div>
</main>
</body>
</html>
