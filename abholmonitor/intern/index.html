<!DOCTYPE html>
<html lang="de">
<head>
<!--
  Abholmonitor – Küche intern
  Grundlage: HTML-Version von Tilman Lichdi (Stand 10/2026), Verhalten unverändert:
  5 × aufs Logo tippen → Eingabe, Nummer + Enter → Tier, Tier per Anfangsbuchstabe,
  Bestellung startet als „prep“, Knöpfe Abholbereit / Zurück / Löschen.
  Öffentliche Anzeige: /abholmonitor/ · Bedienung ohne Eingabe: /abholmonitor/bedienung/
-->
<meta charset="UTF-8">
<title>Abholmonitor – Küche intern</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<link href="https://fonts.cdnfonts.com/css/fontin-sans" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
/* Schrift: Fontin Sans (Link oben). Lädt die nicht, greift wie auf der Website
   die lokal gehostete Nunito – keine weitere externe Anfrage. */
@font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/nunito-400-normal-latin.woff2') format('woff2');
}
@font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('/fonts/nunito-600-normal-latin.woff2') format('woff2');
}

header, footer, .site-header, .site-footer, #header, #footer {
    display: none !important;
}

:root {
    --rot: #af2f3d;
    --gruen: #186118;
    --gold: #e9ba5f;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
}

body {
    font-family: 'Fontin Sans', 'Nunito', sans-serif;
    background: #f7f7f7;
    overflow: hidden;
    box-sizing: border-box;
}

/* Container */
#container {
    position: fixed;
    inset: 0;
    padding: 60px 20px 20px 20px;
    display: flex;
    gap: 20px;
    box-sizing: border-box;
}

/* Spalten */
.column {
    flex: 1 1 33%;
    padding: 15px;
    background: white;
    border-radius: 12px;
    box-sizing: border-box;
    overflow-y: auto;
}

/* Linke Spalte */
#left {
    border: 4px solid var(--gold);
    text-align: center;
}

#logo {
    width: 80%;
    max-width: 300px;
    margin-bottom: 15px;
    cursor: pointer;
}

#left h1 {
    font-size: 2.4rem;
    color: var(--gruen);
    margin: 5px 0;
}

/* Admin-Bereich */
#adminControls {
    display: none;
    margin-top: 15px;
    position: relative;
}

/* Eingabefelder */
.inputWrapper {
    position: relative;
    width: 80%;
    margin: 0 auto 10px auto;
}

#adminControls input {
    padding: 10px;
    font-size: 1.1rem;
    width: 100%;
    border-radius: 8px;
    border: 2px solid var(--gold);
    text-align: center;
}

/* Lösch-Icon */
#clearAnimal {
    position: absolute;
    right: 12px;
    top: 12px;
    font-size: 1.3rem;
    cursor: pointer;
    color: var(--rot);
}

/* Popup nach oben */
#animalPopup {
    display: none;
    position: absolute;
    bottom: 60px;
    left: 10%;
    width: 80%;
    background: white;
    border: 2px solid var(--gold);
    border-radius: 8px;
    padding: 10px;
    z-index: 999;
}

#animalPopup div {
    padding: 8px;
    cursor: pointer;
    font-size: 1.2rem;
}

#animalPopup div:hover {
    background: var(--gold);
}

/* Listen */
.column h2 {
    text-align: center;
    font-size: 1.5rem;
    color: var(--rot);
    margin: 0;
}

.list {
    margin-top: 12px;
}

.order {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px;
    margin: 6px 0;
    border-radius: 8px;
    font-size: 1.3rem;
    font-weight: 600;
}

.order.prep {
    background: var(--gold);
}

.order.ready {
    background: #c8f7c5;
    animation: blinkReady 1.2s infinite;
}

@keyframes blinkReady {
    0% { background-color: #c8f7c5; }
    50% { background-color: #a6e8a3; }
    100% { background-color: #c8f7c5; }
}

.order-buttons button {
    font-size: 0.8rem;
    padding: 5px 9px;
    margin-left: 5px;
    background: var(--rot);
    color: white;
    border: none;
    border-radius: 6px;
}

.order-buttons button:hover {
    background: var(--gruen);
}

/* 📱 Handy hochkant */
@media (max-width: 600px) {
    #container {
        flex-direction: column;
        overflow-y: auto;
        padding: 20px;
    }

    .column {
        flex: none;
        width: 100%;
        margin-bottom: 20px;
    }
}

/* 📟 Tablet hochkant */
@media (max-width: 900px) and (orientation: portrait) {
    #container {
        flex-direction: column;
        overflow-y: auto;
        padding: 30px;
    }

    .column {
        flex: none;
        width: 100%;
        margin-bottom: 25px;
    }
}
</style>
</head>
<body>

<div id="container">

    <!-- Spalte 1 -->
    <div id="left" class="column">

        <img id="logo" src="/abholmonitor/logo-kreis.png" alt="Tjorven Logo">

        <h1>Intern</h1>

        <div id="adminControls">

            <!-- Nummernfeld -->
            <div class="inputWrapper">
                <input id="numberInput" type="text" inputmode="numeric" enterkeyhint="next" placeholder="Nummer">
            </div>

            <!-- Tierfeld + Lösch-Icon -->
            <div class="inputWrapper">
                <input id="animalInput" type="text" enterkeyhint="done" placeholder="Tier (Buchstabe)" maxlength="1">
                <span id="clearAnimal">❌</span>
            </div>

            <!-- Popup nach oben -->
            <div id="animalPopup"></div>

        </div>
    </div>

    <!-- Spalte 2 -->
    <div class="column">
        <h2>In Vorbereitung</h2>
        <div id="prepList" class="list"></div>
    </div>

    <!-- Spalte 3 -->
    <div class="column">
        <h2>Abholbereit</h2>
        <div id="readyList" class="list"></div>
    </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAobjFE0XOHUq8DLRhJf-1hfXQ7LKpKTs",
  authDomain: "abholmonitor.firebaseapp.com",
  databaseURL: "https://abholmonitor-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "abholmonitor",
  storageBucket: "abholmonitor.firebasestorage.app",
  messagingSenderId: "433360255912",
  appId: "1:433360255912:web:99823d9bd84a97d619bb9d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* Tierliste */
const animals = [
  "Nashorn","Dino","Kuh","Pfau","Krokodil","Elch","Robbe","Giraffe","Tiger","Löwe",
  "Eisbär","Hai","Pferd","Elefant","Zebra","Okapi","Schwan","Adler","Gorilla","Nilpferd",
  "Blauwal","Orca","Fuchs"
];

/* Admin-Modus */
let logoClickCount = 0;
let adminActive = false;

document.getElementById("logo").addEventListener("click", () => {
  logoClickCount++;
  if (!adminActive && logoClickCount >= 5) {
    adminActive = true;
    document.getElementById("adminControls").style.display = "block";
    logoClickCount = 0;
    render();   /* Knöpfe an den vorhandenen Bestellungen sofort zeigen */
  }
});

/* ENTER im Nummernfeld → Tierfeld aktivieren */
document.getElementById("numberInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    document.getElementById("animalInput").focus();
  }
});

/* Tier-Popup nach oben */
document.getElementById("animalInput").addEventListener("input", () => {
  const letter = document.getElementById("animalInput").value.toLowerCase();
  const popup = document.getElementById("animalPopup");

  if (!letter) {
    popup.style.display = "none";
    popup.innerHTML = "";
    return;
  }

  const matches = animals.filter(a => a.toLowerCase().startsWith(letter));

  if (matches.length === 0) {
    popup.style.display = "none";
    popup.innerHTML = "";
    return;
  }

  popup.innerHTML = "";
  matches.forEach(animal => {
    const div = document.createElement("div");
    div.textContent = animal;

    /* Tier auswählen → SOFORT auslösen */
    div.onclick = () => {
      document.getElementById("animalInput").value = animal;
      popup.style.display = "none";
      addOrder();
    };

    popup.appendChild(div);
  });

  popup.style.display = "block";
});

/* Lösch-Icon */
document.getElementById("clearAnimal").addEventListener("click", () => {
  document.getElementById("animalInput").value = "";
  document.getElementById("animalPopup").style.display = "none";
});

/* ENTER im Tierfeld → Bestellung speichern */
document.getElementById("animalInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    addOrder();
  }
});

/* Bestellung hinzufügen */
function addOrder() {
  if (!adminActive) return;

  const num = document.getElementById("numberInput").value.trim();
  const animal = document.getElementById("animalInput").value.trim();

  if (!num) return;

  db.ref("orders").push().set({
    number: num,
    animal: animal || "",
    status: "prep"
  });

  document.getElementById("numberInput").value = "";
  document.getElementById("animalInput").value = "";
  document.getElementById("animalPopup").style.display = "none";

  /* Tastatur schließen */
  document.activeElement.blur();
}

/* Status ändern */
function setStatus(id, status) {
  if (!adminActive) return;
  db.ref("orders/" + id).update({ status });
}

/* Löschen */
function removeOrder(id) {
  if (!adminActive) return;
  db.ref("orders/" + id).remove();
}

/* Knopf an einer Bestellung (per Code statt onclick-Text, damit Schlüssel
   und Werte aus der Datenbank nie als HTML/Code gelesen werden) */
function orderButton(text, action) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  b.addEventListener("click", action);
  return b;
}

/* Anzeige */
let orders = {};

function render() {
  const data = orders;
  const prepList = document.getElementById("prepList");
  const readyList = document.getElementById("readyList");

  prepList.innerHTML = "";
  readyList.innerHTML = "";

  const entries = Object.entries(data).sort((a, b) => Number(a[1].number) - Number(b[1].number));

  entries.forEach(([id, o]) => {
    const div = document.createElement("div");
    div.className = "order " + (o.status === "prep" ? "prep" : "ready");

    const animalText = o.animal ? ` – ${o.animal}` : "";

    const text = document.createElement("span");
    text.textContent = `${o.number}${animalText}`;
    div.appendChild(text);

    if (adminActive) {
      const buttons = document.createElement("div");
      buttons.className = "order-buttons";
      buttons.appendChild(o.status === "prep"
        ? orderButton("Abholbereit", () => setStatus(id, "ready"))
        : orderButton("Zurück", () => setStatus(id, "prep")));
      buttons.appendChild(orderButton("Löschen", () => removeOrder(id)));
      div.appendChild(buttons);
    }

    if (o.status === "prep") prepList.appendChild(div);
    else readyList.appendChild(div);
  });
}

db.ref("orders").on("value", snapshot => {
  orders = snapshot.val() || {};
  render();
});
</script>
</body>
</html>
