<!DOCTYPE html>
<html lang="de">
<head>
<!-- Monitor 4 – „Heute bei uns“ (Display-Seite für 32-Zoll-Full-HD, 1920 × 1080).
     Zeigt nur, was in der Verwaltung (/monitor/admin/) eingeschaltet ist; die Überschrift kommt ebenfalls
     von dort. 1–3 Einträge als Kacheln nebeneinander, ab 4 links eine ruhige Bildfolge und rechts die
     Liste aller Angebote mit Preisen (Einzelheiten in specials.js). -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Heute bei uns – Tjorven Bistro</title>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/fontin-sans">
<link rel="stylesheet" href="/monitor/monitor.css">
<link rel="stylesheet" href="/monitor/specials/specials.css">
<script src="/monitor/buehne.js"></script>
<script type="module" src="/monitor/specials/specials.js"></script>
</head>
<body>
<main class="buehne specials">
  <header class="kopf">
    <h1 id="titel">Heute bei uns</h1>
    <img class="logo" src="/images/tjorven-logo-gruen.png" alt="Tjorven Bistro">
  </header>
  <div class="trenner"></div>

  <div class="angebote" id="angebote"></div>

  <!-- ohne aktives Angebot (oder bevor der erste Stand geladen ist) -->
  <div class="willkommen" id="willkommen" hidden>
    <img class="foto" src="/images/abholmonitor/33-willkommen-tjorven-anton-neu-quer.jpeg" alt="Tjorven und Anton im Tjorven Bistro">
  </div>
</main>
</body>
</html>
