<!DOCTYPE html>
<html lang="de">
<head>
<!--
  Abholmonitor – Bedienung (ohne Eingabe)
  Wie der interne Monitor (/abholmonitor/intern/), aber OHNE Eingabe neuer Bestellungen:
  kein Nummernfeld, kein Tierfeld, kein Tier-Popup. Bestehende Bestellungen werden
  angezeigt, je Bestellung eine Zeile mit Symbolknöpfen:
  → Abholbereit · ← Zurück in Vorbereitung · × Löschen (Bezeichnung als aria-label).
  Gleiche Firebase-Daten („orders“), gleiche Statuswerte (prep / ready).
-->
<meta charset="UTF-8">
<title>Abholmonitor – Bedienung</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<link href="https://fonts.cdnfonts.com/css/fontin-sans" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
/* Schrift: Fontin Sans (Link oben). Lädt die nicht, greift wie auf der Website
   die lokal gehostete Nunito – keine weitere externe Anfrage. */
@font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/nunito-400-normal-latin.woff2') format('woff2');
}
@font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('/fonts/nunito-600-normal-latin.woff2') format('woff2');
}

header, footer, .site-header, .site-footer, #header, #footer {
    display: none !important;
}

:root {
    --rot: #af2f3d;
    --gruen: #186118;
    --gold: #e9ba5f;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
}

body {
    font-family: 'Fontin Sans', 'Nunito', sans-serif;
    background: #f7f7f7;
    overflow: hidden;
    box-sizing: border-box;
}

/* Container */
#container {
    position: fixed;
    inset: 0;
    padding: 60px 20px 20px 20px;
    display: flex;
    gap: 20px;
    box-sizing: border-box;
}

/* Spalten */
.column {
    flex: 1 1 33%;
    padding: 15px;
    background: white;
    border-radius: 12px;
    box-sizing: border-box;
    overflow-y: auto;
}

/* Listen */
.column h2 {
    text-align: center;
    font-size: 1.5rem;
    color: var(--rot);
    margin: 0;
}

.list {
    margin-top: 12px;
    /* gemeinsames Spaltenraster aller Zeilen einer Liste (siehe .order) */
    display: grid;
    grid-template-columns: minmax(max-content, 1fr) auto minmax(48px, 1fr);
    column-gap: 8px;
    row-gap: 6px;
}

/* Bestellungen – je Bestellung EINE flache Zeile in drei Bereichen:
   Nummer (– Tier) links | Pfeil in der Mitte | × ganz rechts.
   Linker und rechter Bereich sind gleich breit (1fr), dadurch sitzt der Pfeil
   mittig in der Karte. Ist der Text länger als die linke Hälfte, wächst der
   linke Bereich mit (max-content) und der Pfeil weicht nach rechts aus –
   er verdeckt den Text nie. Nichts bricht um. Mit „subgrid“ teilen sich alle
   Zeilen einer Liste dieselben Spalten: Die Pfeile stehen genau untereinander
   (ältere Browser nutzen die Zeile davor – dann je Zeile für sich). */
.order {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: minmax(max-content, 1fr) auto minmax(48px, 1fr);
    grid-template-columns: subgrid;
    align-items: center;
    column-gap: 8px;
    padding: 5px 6px 5px 14px;
    margin: 0;
    border-radius: 10px;
    font-size: 1.4rem;
    font-weight: 600;
}

.order > span {
    grid-column: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    /* Obergrenze nur für ungewöhnlich lange Einträge, damit × immer erreichbar
       bleibt (zwei Spalten nebeneinander; einspaltig siehe unten) */
    max-width: calc(50vw - 200px);
}

.order.prep {
    background: var(--gold);
}

.order.ready {
    background: #c8f7c5;
    animation: blinkReady 1.2s infinite;
}

@keyframes blinkReady {
    0% { background-color: #c8f7c5; }
    50% { background-color: #a6e8a3; }
    100% { background-color: #c8f7c5; }
}

/* Die Knopfgruppe löst sich im Raster auf: Pfeil → Mitte, × → rechter Rand */
.order-buttons {
    display: contents;
}

.order-buttons button:first-child {
    grid-column: 2;
}

.order-buttons button:last-child {
    grid-column: 3;
    justify-self: end;
}

/* Symbolknöpfe → ← ×: kompakt, aber 48 × 48 px Tippfläche */
.order-buttons button {
    flex: none;
    width: 48px;
    height: 48px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--rot);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
}

.order-buttons button svg {
    width: 28px;
    height: 28px;
}

.order-buttons button:hover,
.order-buttons button:active {
    background: var(--gruen);
}

/* 📱 Handy hochkant */
@media (max-width: 600px) {
    #container {
        flex-direction: column;
        overflow-y: auto;
        padding: 20px;
    }

    .column {
        flex: none;
        width: 100%;
        margin-bottom: 20px;
    }
}

/* 📟 Tablet hochkant */
@media (max-width: 900px) and (orientation: portrait) {
    #container {
        flex-direction: column;
        overflow-y: auto;
        padding: 30px;
    }

    .column {
        flex: none;
        width: 100%;
        margin-bottom: 25px;
    }
}

/* einspaltig (Tablet hochkant): Obergrenze des Textes an der vollen Breite */
@media (max-width: 900px) and (orientation: portrait) {
    .order > span {
        max-width: calc(100vw - 230px);
    }
}

/* 📱 Handy: schmale Ränder, damit viele Bestellungen auf den Schirm passen
   (steht nach „Tablet hochkant“, weil diese Regel auch für Handys gilt) */
@media (max-width: 600px) {
    #container {
        padding: 12px;
        gap: 12px;
    }

    .column {
        padding: 10px;
        margin-bottom: 0;
    }

    .list {
        margin-top: 6px;
    }

    .order > span {
        max-width: calc(100vw - 180px);
    }
}
</style>
</head>
<body>

<div id="container">

    <!-- Spalte 1 -->
    <div class="column">
        <h2>In Vorbereitung</h2>
        <div id="prepList" class="list"></div>
    </div>

    <!-- Spalte 2 -->
    <div class="column">
        <h2>Abholbereit</h2>
        <div id="readyList" class="list"></div>
    </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAobjFE0XOHUq8DLRhJf-1hfXQ7LKpKTs",
  authDomain: "abholmonitor.firebaseapp.com",
  databaseURL: "https://abholmonitor-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "abholmonitor",
  storageBucket: "abholmonitor.firebasestorage.app",
  messagingSenderId: "433360255912",
  appId: "1:433360255912:web:99823d9bd84a97d619bb9d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* Status ändern */
function setStatus(id, status) {
  db.ref("orders/" + id).update({ status });
}

/* Löschen */
function removeOrder(id) {
  db.ref("orders/" + id).remove();
}

/* Symbole der Knöpfe (feste SVG-Grafiken, keine Emoji) */
const ICONS = {
  rechts:  '<path d="M4 12h15M13 6l6 6-6 6"/>',
  links:   '<path d="M20 12H5M11 6l-6 6 6 6"/>',
  loeschen: '<path d="M6 6l12 12M18 6L6 18"/>'
};

/* Knopf an einer Bestellung: sichtbar nur das Symbol, die Bedeutung steht im
   aria-label (Screenreader) und im title (Tooltip mit Maus). Per Code statt
   onclick-Text, damit Werte aus der Datenbank nie als HTML/Code gelesen werden. */
function orderButton(label, icon, action) {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-label", label);
  b.title = label;
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + ICONS[icon] + '</svg>';
  b.addEventListener("click", action);
  return b;
}

/* Anzeige – wie im internen Monitor, die Knöpfe sind hier immer da */
db.ref("orders").on("value", snapshot => {
  const data = snapshot.val() || {};
  const prepList = document.getElementById("prepList");
  const readyList = document.getElementById("readyList");

  prepList.innerHTML = "";
  readyList.innerHTML = "";

  const entries = Object.entries(data).sort((a, b) => Number(a[1].number) - Number(b[1].number));

  entries.forEach(([id, o]) => {
    const div = document.createElement("div");
    div.className = "order " + (o.status === "prep" ? "prep" : "ready");

    const animalText = o.animal ? ` – ${o.animal}` : "";

    const text = document.createElement("span");
    text.textContent = `${o.number}${animalText}`;
    div.appendChild(text);

    const buttons = document.createElement("div");
    buttons.className = "order-buttons";
    buttons.appendChild(o.status === "prep"
      ? orderButton("Abholbereit", "rechts", () => setStatus(id, "ready"))
      : orderButton("Zurück in Vorbereitung", "links", () => setStatus(id, "prep")));
    buttons.appendChild(orderButton("Bestellung löschen", "loeschen", () => removeOrder(id)));
    div.appendChild(buttons);

    if (o.status === "prep") prepList.appendChild(div);
    else readyList.appendChild(div);
  });
});
</script>
</body>
</html>
