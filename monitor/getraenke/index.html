<!DOCTYPE html>
<html lang="de">
<head>
<!-- Monitor 3 – Getränkekarte (Display-Seite für 32-Zoll-Full-HD, 1920 × 1080).
     Normalbetrieb, drei Spalten: links eine ruhige Bildfolge (Eistee, Cappuccino, fritz – langsames
     Überblenden, je Foto eine grüne Leiste mit Getränk und Preis), Mitte „kalt“, rechts „heiß“.
     „Kleines Bistro“ (Schalter in der Verwaltung von Monitor 4): zwei Spalten – links die Bildfolge,
     rechts die reduzierte Liste (kalt ohne Hagebutten-Eistee, heiß nur Filterkaffee), größer gesetzt.
     Überschriften klein und fett wie auf der Original-Karte, Preise mit einer Nachkommastelle.
     Die fritz-Bilder sind aus den Produktfotos des Herstellers zusammengesetzt (images/monitore/).
     Hagebutten-Eistee mit blassrotem Band wie auf der Original-Getränkekarte.
     Namen, Mengen, Preise und Fotos stehen nur in /daten/getraenke.js (dieselben Daten wie die Startseite). -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Getränkekarte – Tjorven Bistro</title>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/fontin-sans">
<link rel="stylesheet" href="/monitor/monitor.css">
<link rel="stylesheet" href="/monitor/getraenke/getraenke.css">
<script src="/monitor/buehne.js"></script>
<script type="module" src="/monitor/getraenke/getraenke.js"></script>
</head>
<body>
<main class="buehne getraenke">
  <header class="kopf">
    <h1>Getränkekarte</h1>
    <img class="logo" src="/images/tjorven-logo-gruen.png" alt="Tjorven Bistro">
  </header>
  <div class="trenner"></div>

  <!-- Normalbetrieb: Bildfolge, „kalt“, „heiß“ – Inhalt kommt aus /daten/getraenke.js (getraenke.js baut ihn auf) -->
  <div class="spalten modus" id="normal">
    <section class="spalte bilder">
      <div class="diashow" id="diashow"></div>
    </section>
  </div>

  <!-- Kleines Bistro / reduziertes Angebot: kalt ohne Hagebutten-Eistee, heiß nur Filterkaffee -->
  <div class="spalten klein modus" id="klein" hidden>
    <section class="spalte bilder">
      <div class="diashow" id="diashowKlein"></div>
    </section>
  </div>
</main>
</body>
</html>
