<!DOCTYPE html>
<html lang="de">
<head>
<!--
  Abholmonitor – öffentliche Anzeige (Fernseher im Bistro)
  Grundlage: HTML-Version von Tilman Lichdi (Stand 10/2026). Diese Seite LIEST die
  Bestellungen nur (Firebase „orders“) – keine Eingabe, keine Bedienknöpfe.
  Küche: /abholmonitor/intern/ · Bedienung ohne Eingabe: /abholmonitor/bedienung/

  Zwei Modi, umgeschaltet allein durch Firebase:
  – keine Bestellung in „orders“  → Werbung im Vollbild (Querformat-Bilder)
  – mindestens eine Bestellung    → In Vorbereitung | Abholbereit | Werbung hochkant (rechte Spalte)
  Beide Darstellungen zeigen dieselbe Slide-Liste (unten „slides“) im selben Takt.
-->
<meta charset="UTF-8">
<title>Abholmonitor – Öffentliche Anzeige</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<link href="https://fonts.cdnfonts.com/css/fontin-sans" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
/* Schrift: Fontin Sans (Link oben). Lädt die nicht, greift wie auf der Website
   die lokal gehostete Nunito – keine weitere externe Anfrage. */
@font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/nunito-400-normal-latin.woff2') format('woff2');
}
@font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('/fonts/nunito-600-normal-latin.woff2') format('woff2');
}
@font-face {
    font-family: 'Nunito';
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/nunito-400-italic-latin.woff2') format('woff2');
}

header, footer, .site-header, .site-footer, #header, #footer {
    display: none !important;
}

:root {
    --rot: #af2f3d;
    --gruen: #186118;
    --gold: #e9ba5f;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
}

body {
    font-family: 'Fontin Sans', 'Nunito', sans-serif;
    background: #f7f7f7;
    overflow: hidden;
    box-sizing: border-box;
}

/* ================= Umschaltung der Modi =================
   data-modus am <body> setzt allein das Firebase-Ergebnis (siehe Skript). */
#vollbild {
    display: none;
}
body[data-modus="werbung"] #vollbild {
    display: block;
    animation: modusEin 0.8s ease-out;
}
body[data-modus="werbung"] #container {
    display: none;
}
body[data-modus="bestellung"] #container {
    animation: modusEin 0.8s ease-out;
}
@keyframes modusEin {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Container */
#container {
    position: fixed;
    inset: 0;
    padding: 60px 20px 20px 20px;
    display: flex;
    gap: 20px;
    box-sizing: border-box;
}

/* Spalten */
.column {
    flex: 1 1 33%;
    padding: 15px;
    background: white;
    border-radius: 12px;
    box-sizing: border-box;
    overflow-y: auto;
}

/* Rechte Spalte – Werbung hochkant */
#werbung {
    border: 4px solid var(--gold);
    padding: 0;
    overflow: hidden;
}

#slideshow {
    width: 100%;
    height: 100%;
    position: relative;
    container-type: size;
}

/* ---------- Gemeinsam für beide Darstellungen ----------
   Überblendung 3 s, Anzeigedauer 9000 ms wie im Original. */
.slide {
    position: absolute;
    inset: 0;
    margin: 0;
    background: var(--gruen);
    color: #fff;
    opacity: 0;
    transition: opacity 3s ease-in-out;
    overflow: hidden;
    visibility: hidden;
}
.slide.sichtbar { visibility: visible; }
/* Getränkeliste wie auf der Speisekarte („Espresso | Doppio  2.5 | 3.5“):
   Name und Preis direkt nebeneinander, Preise rechtsbündig untereinander,
   die ganze Liste kompakt und mittig in der Karte – keine langen Zeilen. */
.karte {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: auto auto;
    justify-content: center;
    text-align: left;
}
.karte li { display: contents; }
.karte li > span {
    padding: 0.16em 0;
    white-space: nowrap;
}
.karte li + li > span:not(.sub) { border-top: 2px solid rgba(255, 255, 255, 0.25); }
.karte li > span:first-child { padding-right: 1.1em; }
.karte .preis {
    font-weight: 600;
    color: var(--gold);
    text-align: right;
}
.slide .name,
.slide .titel { font-weight: 600; }
.slide .preis {
    font-weight: 600;
    color: var(--gold);
    white-space: nowrap;
}
.slide .unter {
    color: var(--gold);
    font-weight: 600;
}
.slide .zusatz { opacity: 0.92; line-height: 1.3; }
.slide .texte { display: flex; flex-direction: column; gap: 0.35em; line-height: 1.3; }
.karte .sub {
    grid-column: 1 / -1;
    font-size: 0.62em;
    font-weight: 400;
    opacity: 0.9;
    padding-top: 0;
}
/* Produktfolien: Name, Preis und Beschreibung mittig (Wunsch Tilman, ruhigeres
   Schriftbild); bei Kaffee mittig die Überschrift, die Liste bleibt tabellarisch.
   Ausnahme Waffel: ab „Mix & Match …“ mit den Toppings linksbündig (Liste). */
.slide.willkommen figcaption,
.slide.produkt figcaption,
.slide.kaffee figcaption {
    align-items: center;
    text-align: center;
}
.slide.produkt .toppings,
.slide.produkt.mit-toppings .texte {
    align-self: stretch;
    text-align: left;
}
.slide.willkommen .titel .zeile { display: block; white-space: nowrap; }
.toppings {
    list-style: none;
    margin: 0;
    padding: 0;
    line-height: 1.3;
}
.toppings li {
    display: flex;
    justify-content: space-between;
    gap: 0.6em;
    border-bottom: 1px solid rgba(255, 255, 255, 0.22);
    padding: 0.08em 0;
}
.toppings li:last-child { border-bottom: 0; }
.toppings .aufpreis { color: var(--gold); font-weight: 600; white-space: nowrap; }
/* QR-Code zur Catering-Seite: weiße Fläche mit Ruhezone, darunter die Adresse */
.qr-zeile {
    display: flex;
    align-items: flex-end;
    gap: 1em;
}
.qr-zeile > .punkte { flex: 1 1 auto; min-width: 0; }
.qr {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3em;
    width: min-content;   /* so breit wie der Code; die Adresse bricht darunter um */
}
.qr img {
    display: block;
    background: #fff;
    border-radius: 10px;
    image-rendering: pixelated;   /* QR-Module scharf, auch bei krummer Skalierung */
}
.qr span { font-size: 0.7em; opacity: 0.95; overflow-wrap: anywhere; }   /* Adresse darf an „/“ umbrechen */
#slideshow .qr span { text-align: center; }
.slide .punkte {
    margin: 0;
    padding: 0;
    list-style: none;
    line-height: 1.3;
}
.slide .punkte li {
    padding-left: 1.2em;
    position: relative;
    margin: 0.18em 0;
}
.slide .punkte li::before {
    content: "✓";
    position: absolute;
    left: 0;
    color: var(--gold);
}
.slide .cta { line-height: 1.35; opacity: 0.95; }
.unschaerfe {
    filter: blur(28px) brightness(0.8);
    transform: scale(1.15);
}

/* ---------- Hochkant (rechte Spalte im Bestellmodus) ----------
   Foto oben, Text darunter – wie in Tilmans fertigen Grafiken. Schriftgrößen
   wachsen mit der Spalte (cqw); ältere Browser nehmen den Wert davor (1920×1080). */
#slideshow .slide {
    display: flex;
    flex-direction: column;
}
#slideshow .slide.grafik img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center top;
}
#slideshow .foto {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    background: #ece5da;
}
#slideshow .foto img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
/* Nur ein Querformat vorhanden (z. B. Lasagne-Platzhalter): ganz zeigen, dahinter unscharf */
#slideshow .foto.quer img.bild { object-fit: contain; }
#slideshow .foto.deckblatt {
    flex: 0 0 auto;
    aspect-ratio: 1200 / 848;
}
/* Querformat-Foto ohne Hochkant-Gegenstück (Bistro-Foto): oben ganz, ohne Personen anzuschneiden */
#slideshow .foto.quer-oben {
    flex: 0 0 auto;
    aspect-ratio: 3 / 2;
}
#slideshow .willkommen .foto.quer-oben { aspect-ratio: 1 / 1; }
#slideshow figcaption {
    flex: 0 0 auto;
    padding: 4.5% 6% 5.5%;
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    line-height: 1.15;
}
#slideshow .promo figcaption { gap: 0.5em; }
#slideshow .promo.mit-deckblatt figcaption,
#slideshow .willkommen figcaption,
#slideshow .promo .foto.quer-oben + figcaption {
    flex: 1 1 auto;
    justify-content: center;
}
#slideshow .promo.rot { background: var(--rot); }
#slideshow .name { font-size: 46px; font-size: 7.6cqw; }
#slideshow .preis { font-size: 64px; font-size: 10.5cqw; }
#slideshow .zusatz { font-size: 27px; font-size: 4.4cqw; }
#slideshow .texte { font-size: 25px; font-size: 4.2cqw; }
#slideshow .toppings { font-size: 26px; font-size: 4.3cqw; }
#slideshow .karte { font-size: 34px; font-size: 5.6cqw; }
#slideshow .karte .preis { font-size: 1em; }
#slideshow .titel { font-size: 44px; font-size: 7.2cqw; line-height: 1.12; }
#slideshow .willkommen .titel { font-size: 58px; font-size: 9.6cqw; }
#slideshow .unter { font-size: 28px; font-size: 4.6cqw; }
#slideshow .punkte { font-size: 25px; font-size: 4.2cqw; }
#slideshow .cta { font-size: 25px; font-size: 4.2cqw; margin-top: 0.2em; }
#slideshow .qr img { width: 150px; width: max(110px, 25cqw); height: auto; }
#slideshow .qr span { font-size: 15px; font-size: max(12px, 2.6cqw); }

/* ---------- Vollbild (Querformat, keine Bestellung) ----------
   Das Querformat-Bild füllt den ganzen Fernseher; Name, Beschreibung und Preis
   stehen in einer grünen Karte dort, wo das Produkt nicht verdeckt wird
   (Position je Slide, siehe „text“ in der Slide-Liste). Größen in vh = Fernsehhöhe. */
#vollbild {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: var(--gruen);
    overflow: hidden;
}
#vollbild .bild-voll,
#vollbild .unschaerfe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
/* Fertige Grafik (hochkant, mit eigenem Text): ganz, mittig, ohne zusätzlichen Text */
#vollbild .grafik-bild {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}
/* Produkt mittig im Querformat-Foto (Wrap, Focaccia): Das Foto steht in voller
   Höhe links, die Textfläche rechts daneben – zur Textfläche hin läuft das Foto
   weich in dieselbe, unscharfe Aufnahme aus. So wird nichts vom Produkt verdeckt. */
#vollbild .bild-seite {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: auto;
    max-width: none;
    -webkit-mask-image: linear-gradient(to right, #000 78%, transparent);
    mask-image: linear-gradient(to right, #000 78%, transparent);
}
/* Nur ein Hochkant-Foto vorhanden: Foto rechts ganz, Text links */
#vollbild .hoch-bild {
    position: absolute;
    top: 4vh;
    right: 6vw;
    height: 92vh;
    width: auto;
    object-fit: contain;
    border-radius: 24px;
    box-shadow: 0 1.2vh 4vh rgba(0, 0, 0, 0.3);
}
/* Broschüren-Deckblatt (Querformat mit eigenem Titel): links ganz, Punkte rechts */
#vollbild .deckblatt-bild {
    position: absolute;
    left: 3vw;
    top: 50%;
    transform: translateY(-50%);
    width: 58vw;
    height: auto;
    object-fit: contain;
    border-radius: 18px;
    box-shadow: 0 1.2vh 4vh rgba(0, 0, 0, 0.3);
}
#vollbild figcaption {
    position: absolute;
    box-sizing: border-box;
    max-height: 92vh;
    padding: 3.4vh 2.4vw 3.8vh;
    display: flex;
    flex-direction: column;
    gap: 1.1vh;
    line-height: 1.15;
    background: rgba(24, 97, 24, 0.93);
    border-radius: 28px;
    box-shadow: 0 1.2vh 4vh rgba(0, 0, 0, 0.28);
}
#vollbild .rot figcaption { background: rgba(175, 47, 61, 0.95); }
/* Willkommen: Textfeld links oben über Tjorvens Schulter, so breit wie der Text */
#vollbild .pos-oben-links { top: 6vh; left: 3.5vw; width: auto; padding-left: 2.8vw; padding-right: 2.8vw; }
/* Produkte: grüne Textfläche HOCHKANT seitlich neben dem Produkt, nie als Querbalken */
#vollbild .pos-links { top: 50%; left: 2.5vw; width: 27vw; transform: translateY(-50%); }
#vollbild .pos-rechts { top: 50%; right: 2.5vw; width: 27vw; transform: translateY(-50%); }
#vollbild .produkt .pos-links,
#vollbild .produkt .pos-rechts,
#vollbild .produkt .pos-seite,
#vollbild .kaffee .pos-seite { min-height: 58vh; justify-content: center; }
#vollbild .pos-rechts-breit { top: 50%; right: 2.5vw; width: 29vw; transform: translateY(-50%); }
#vollbild .pos-split { top: 50%; left: 5vw; width: 42vw; transform: translateY(-50%); }
/* nur Hochkant-Foto (rechts): Textfläche mittig im freien Bereich links davon */
#vollbild .pos-seite { top: 50%; left: 29.5vw; width: 29vw; transform: translate(-50%, -50%); }
#vollbild .kaffee .pos-seite { width: 38vw; min-height: 66vh; }
#vollbild .pos-deckblatt { top: 50%; right: 3vw; width: 33vw; transform: translateY(-50%); }
#vollbild .name { font-size: 7vh; }
#vollbild .pos-links .name,
#vollbild .pos-rechts .name,
#vollbild .pos-seite .name { font-size: 6vh; }   /* schmale Seitenkarten: lange Wörter wie „Hausgemachte“ passen */
#vollbild .preis { font-size: 9.5vh; }
#vollbild .zusatz { font-size: 3.1vh; }
#vollbild .texte { font-size: 3.1vh; }
#vollbild .toppings { font-size: 3.2vh; }
#vollbild .karte { font-size: 4.2vh; }
#vollbild .karte .preis { font-size: 1em; }
#vollbild .titel { font-size: 6.2vh; line-height: 1.1; }
#vollbild .pos-links .titel,
#vollbild .pos-rechts-breit .titel { font-size: 5.2vh; }
#vollbild .kaffee .titel { font-size: 5.2vh; margin-bottom: 1vh; }
#vollbild .willkommen .titel { font-size: 6.4vh; line-height: 1.14; }
#vollbild .unter { font-size: 3.6vh; }
#vollbild .pos-rechts-breit .unter { font-size: 3.2vh; }
#vollbild .punkte { font-size: 3.3vh; }
#vollbild .cta { font-size: 2.9vh; margin-top: 0.6vh; }
#vollbild .qr img { width: 19vh; height: auto; }
#vollbild .qr span { font-size: 2vh; }
#vollbild .pos-rechts-breit .qr img { width: 17vh; }
/* schmale Karten: QR-Code unter dem Text, Adresse daneben */
#vollbild .pos-deckblatt .qr-zeile,
#vollbild .pos-rechts-breit .qr-zeile { flex-direction: column; align-items: flex-start; gap: 1.6vh; }
#vollbild .pos-deckblatt .qr,
#vollbild .pos-rechts-breit .qr { flex-direction: row; align-items: flex-end; gap: 1vw; width: auto; }

/* ---------- Zusatzinfo-Folie: drei Textflächen wie auf der Speisekarte ----------
   Hintergrund wie bei den übrigen Folien: das Küchenfoto (Anton, Bild 34) unscharf
   und hell, darüber das echte Tjorven-Logo (abholmonitor/logo-kreis.png) groß und
   blass. Im Vollbild steht das Foto zusätzlich scharf in der Mitte. Organische
   Flächen in Rosa/Grün, dunkle Schrift – der Text bleibt immer INNERHALB der Fläche. */
.slide.info {
    background: #fdfbf8;
    color: #2a2724;
}
.slide.info .unschaerfe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(26px) saturate(0.9);
}
.slide.info .schleier {
    position: absolute;
    inset: 0;
    background: rgba(253, 251, 248, 0.6);
}
.slide.info .info-logo {
    position: absolute;
    opacity: 0.14;
    pointer-events: none;
}
.slide.info .blob {
    position: absolute;
    box-sizing: border-box;
    line-height: 1.35;
    box-shadow: 0 0.8vh 3vh rgba(0, 0, 0, 0.12);
}
.slide.info .blob h3 {
    margin: 0 0 0.35em;
    color: var(--gruen);
    font-weight: 600;
    font-style: normal;
    line-height: 1.15;
}
.slide.info .rosa { background: #efced3; }
.slide.info .gruen { background: #c8dac9; }
.slide.info .kursiv { font-style: italic; }
.slide.info strong { font-weight: 600; font-style: italic; }
.slide.info .linsen { border-radius: 46% 54% 48% 52% / 58% 50% 50% 42%; }
.slide.info .bohne { border-radius: 52% 48% 44% 56% / 50% 56% 44% 50%; }
.slide.info .koffein {
    border-radius: 50% 50% 46% 54% / 56% 44% 56% 44%;
    font-weight: 600;
    font-style: italic;
    text-align: center;
}
/* Vollbild: Foto scharf in der Mitte, zwei Flächen links, eine rechts (Anton bleibt frei) */
#vollbild .info .info-foto {
    position: absolute;
    top: 7vh;
    left: 50%;
    height: 86vh;
    width: auto;
    transform: translateX(-50%);
    border-radius: 24px;
    box-shadow: 0 1.2vh 4vh rgba(0, 0, 0, 0.25);
}
#vollbild .info .info-logo { height: 112vh; right: -16vh; top: -6vh; }
#vollbild .info .linsen { left: 2.2vw; top: 4.5vh; width: 34vw; padding: 9vh 5.4vw 9.5vh; font-size: 2.75vh; }
#vollbild .info .bohne { right: 2.2vw; top: 50%; transform: translateY(-50%); width: 30.5vw; padding: 9.5vh 4.6vw 10vh; font-size: 2.75vh; }
#vollbild .info .koffein { left: 4.5vw; bottom: 4vh; width: 28vw; padding: 7vh 4.6vw; font-size: 3.3vh; transform: rotate(-5deg); text-wrap: balance; }
#vollbild .info h3 { font-size: 3.7vh; }
/* Hochkant-Spalte: untereinander */
#slideshow .slide.info {
    justify-content: space-evenly;
    align-items: center;
}
#slideshow .info .info-logo { width: 125%; left: -12%; top: 18%; }
#slideshow .info .blob { position: relative; width: 96%; padding: 8.5% 13% 9%; font-size: 21px; font-size: 3.45cqw; }
/* schmale Spalte: flachere Rundungen oben/unten, damit auch die erste und letzte Zeile in der Fläche bleiben */
#slideshow .info .linsen { border-radius: 42% 46% 44% 48% / 30% 28% 32% 30%; }
#slideshow .info .bohne { border-radius: 46% 42% 48% 44% / 28% 32% 28% 32%; }
#slideshow .info .koffein { text-wrap: balance; width: 80%; font-size: 26px; font-size: 4.3cqw; transform: rotate(-4deg); padding: 8% 12%; }
#slideshow .info h3 { font-size: 27px; font-size: 4.4cqw; }

/* Mittlere & rechte Spalte */
.column h2 {
    text-align: center;
    font-size: 2.6rem;
    color: var(--gruen);
    margin: 0;
    font-weight: 600;
}

.list {
    margin-top: 12px;
}

/* Bestellkarten – Grundlage wie auf dem bewährten Live-Monitor
   (tilmanlichdi.com/abholmonitor/, gemessen 11.10.2026: Nummer 96 px auf einer
   80 px hohen Karte). Wunsch Oktober 2026: Nummer weiter groß und fett, aber
   kleiner (80 px) und nicht mehr fast kartenhoch – Ziffern füllen gut 60 % der
   Karte (88 px) und stehen mittig; Tiername im selben Verhältnis kleiner. */
.order {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 6px 28px 2px;   /* Ziffern optisch mittig */
    margin: 12px 0;
    border-radius: 10px;
}

.order span {
    font-size: 5rem;
    font-weight: 600;
    line-height: 1;
    color: #000000;
    white-space: nowrap;
}

.order .animal {
    font-size: 2.1rem;
    margin-left: 20px;
    font-weight: 600;
    line-height: 1;
    color: #000000;
    white-space: nowrap;
}

.order.prep {
    background: var(--gold);
}

.order.ready {
    background: #c8f7c5;
    animation: blinkReady 1.2s infinite;
}

@keyframes blinkReady {
    0% { background-color: #c8f7c5; }
    50% { background-color: #a6e8a3; }
    100% { background-color: #c8f7c5; }
}

/* Handy */
@media (max-width: 600px) {
    #container {
        flex-direction: column;
        overflow-y: auto;
        padding: 20px;
    }

    .column {
        flex: none;
        width: 100%;
        margin-bottom: 20px;
    }

    .order span {
        font-size: 3.4rem;
    }

    .order .animal {
        font-size: 1.7rem;
    }
}

/* Tablet */
@media (max-width: 900px) and (orientation: portrait) {
    #container {
        flex-direction: column;
        overflow-y: auto;
        padding: 30px;
    }

    .column {
        flex: none;
        width: 100%;
        margin-bottom: 25px;
    }
}

/* Untereinander (Handy/Tablet hochkant): Die Werbespalte bekommt das
   Seitenverhältnis wie auf dem Fernseher, sonst hätte sie keine Höhe. */
@media (max-width: 600px), (max-width: 900px) and (orientation: portrait) {
    #werbung {
        aspect-ratio: 605 / 992;
        flex: none;
    }
}

/* Hochkant-Bildschirm ohne Bestellung: statt Querformat die Hochkant-Werbung
   bildschirmfüllend (gleiche Slides). */
@media (orientation: portrait) {
    body[data-modus="werbung"] #vollbild { display: none; }
    body[data-modus="werbung"] #container {
        display: flex;
        padding: 20px;
        overflow: hidden;
    }
    body[data-modus="werbung"] #container > .column:not(#werbung) { display: none; }
    body[data-modus="werbung"] #werbung {
        flex: 1 1 auto;
        aspect-ratio: auto;
        height: 100%;
        margin: 0;
    }
}
</style>
</head>
<body data-modus="werbung">

<!-- Modus „keine Bestellung“: Werbung im Vollbild (Querformat) -->
<div id="vollbild" aria-hidden="true"></div>

<!-- Modus „Bestellung vorhanden“ -->
<div id="container">

    <!-- Spalte 1 -->
    <div class="column">
        <h2>In Vorbereitung</h2>
        <div id="prepList" class="list"></div>
    </div>

    <!-- Spalte 2 -->
    <div class="column">
        <h2>Abholbereit</h2>
        <div id="readyList" class="list"></div>
    </div>

    <!-- Spalte 3 – Werbung hochkant -->
    <div id="werbung" class="column">
        <div id="slideshow"></div>
    </div>

</div>

<script>
/* ============ Slide-Liste – EINE Liste für Vollbild (quer) und Spalte (hoch) ============
   Reihenfolge = Anzeigereihenfolge (Vorgaben Tilman, Oktober 2026). Texte und Preise wie
   vorgegeben; Preise wie auf der Speisekarte: Dezimalpunkt, ohne €-Zeichen, glatte
   Beträge immer mit „.0“ (8.0, 4.0).
   quer / hoch: zusammengehörige Bilder aus /images/abholmonitor/. Fehlt ein Format, wird
   das vorhandene Bild ganz gezeigt (nichts verzerrt, nichts unvorteilhaft beschnitten).
   text: Seite der grünen Textfläche im Vollbild (immer hochkant seitlich, dort wo das
   Produkt bzw. die Personen frei bleiben). fotoSeitlich: Produkt steht mittig im Foto –
   das Foto rückt im Vollbild zur anderen Seite (siehe .bild-seite).
   posQuer / posHoch: Bildausschnitt (object-position). qr: Schlüssel aus QRS (unten).
   aktiv: false = wird übersprungen. */
const BILD = "/images/abholmonitor/";
/* QR-Codes: direkt zur Online-Broschüre mit Planer/Anfrageformular.
   Eigene Seiten für Abendfeiern bzw. Brunch auf der Eventfläche gibt es noch nicht –
   sobald es sie gibt, hier Ziel, Bild (neu erzeugen) und Text tauschen. */
const QRS = {
  catering: { bild: "/abholmonitor/qr-catering-broschuere.svg", text: "tjorven-bistro.de/catering/broschuere" },          // https://tjorven-bistro.de/catering/broschuere/
  kindergeburtstag: { bild: "/abholmonitor/qr-kindergeburtstag.svg", text: "tjorven-bistro.de/kindergeburtstag" }       // https://tjorven-bistro.de/kindergeburtstag/
};
const slides = [
  { typ: "willkommen", quer: BILD + "33-willkommen-tjorven-anton-neu-quer.jpeg", text: "oben-links", posQuer: "50% 35%", posHochQuer: "66% 50%",
    titel: ["Herzlich", "Willkommen", "im", "Tjorven Bistro"] },

  { typ: "produkt", quer: BILD + "13-saisonale-bowl-quer.jpeg", hoch: BILD + "14-saisonale-bowl-hochkant.jpeg",
    text: "rechts", posHoch: "50% 70%",
    name: "Tjorvens saisonale Bowl", preis: "13.5",
    texte: ["Knackiger Blattsalat auf Quinoa und Buchweizen aus Schwaigern mit gebackenen Kartoffeln, saisonalem Gemüse, gekeimten schwäbischen Linsen, Pickles und kleinen Leckereien an unserem hausgemachten French Dressing."] },

  { typ: "produkt", hoch: BILD + "23-pommes-service-hochkant.jpeg", posHoch: "50% 45%",
    name: "Knusprige Pommes", preis: "4.5",
    texte: ["Eine große Portion Pommes mit Ketchup & hausgemachter Mayonnaise."] },

  { typ: "produkt", quer: BILD + "12-focaccia-quer.jpeg", hoch: BILD + "11-focaccia-hochkant.jpeg",
    text: "rechts", fotoSeitlich: true, posHoch: "50% 62%",
    name: "Saisonales Focaccia", preis: "5.5",
    texte: ["Selbstgebackenes Focaccia, belegt mit Hummus, grünem Pesto, saisonalem Gemüse und Salat.", "Knusprig getoastet."] },

  { typ: "produkt", quer: BILD + "09-wrap-gemuese-quer.jpeg", hoch: BILD + "10-wrap-gemuese-hochkant.jpeg",
    text: "rechts", fotoSeitlich: true, posHoch: "50% 72%",
    name: "Getoasteter Wrap", preis: "8.0",
    texte: ["Fladenbrot gefüllt mit saisonalem Gemüse, gekeimten schwäbischen Linsen, Kräutercreme und Blattsalat.",
            "Wir servieren unsere Wraps außen knusprig getoastet und innen erfrischend kühl."] },

  { typ: "produkt", quer: BILD + "18-waffel-puderzucker-quer.jpeg", hoch: BILD + "17-waffel-puderzucker-hochkant.jpeg",
    text: "rechts", posHoch: "35% 72%",
    name: "Hausgemachte Belgische Waffel", preis: "4.5",
    texte: ["Mix & Match mit Toppings Deiner Wahl"],
    toppings: [["Puderzucker", ""], ["Zimt & Zucker", ""], ["Schokosauce", "+1.0"], ["Rübensirup", "+1.0"], ["Apfelmus", "+1.0"]] },

  { typ: "produkt", hoch: BILD + "30-hagebutten-eistee-hochkant.jpeg", posHoch: "45% 70%",
    name: "Hausgemachter Hagebutten-Eistee", preis: "3.5",
    texte: ["Gesüßt oder ungesüßt", "0,40 l"] },

  /* Kaffee wie auf der Speisekarte: „Espresso | Doppio  2.5 | 3.5“ in einer Zeile */
  { typ: "kaffee", hoch: BILD + "24-kaffee-cappuccino-barista-hochkant.jpeg", posHoch: "50% 62%",
    titel: "Espresso & Tee",
    liste: [["Espresso | Doppio", "2.5 | 3.5"], ["Espresso Macchiato", "3.0"], ["Cortado", "3.2"], ["Americano", "3.5"],
            ["Bio Tee", "3.5", "Kräuter | Früchte | Grün | Schwarz"]] },

  { typ: "kaffee", hoch: BILD + "08-kaffee-cappuccino-hochkant.jpeg", posHoch: "50% 82%",
    titel: "Cappuccino & Kaffeespezialitäten",
    liste: [["Cappuccino", "4.0"], ["Milchkaffee", "4.0"], ["Latte Macchiato", "4.5"], ["Heiße Schokolade", "3.5"]] },

  /* Kindergeburtstag: bestehende Folie (Deckblatt + Punkte aus downloads/kindergeburtstag-tjorven-bistro.pdf) + QR */
  { typ: "promo", deckblatt: "/images/kindergeburtstag-broschuere/seite-1-1200.webp", rot: true,
    punkte: ["Eigener Tischbereich für Eure Gruppe", "Mehrfaches Kommen und Gehen möglich",
             "Kuchen darf mitgebracht werden", "Kindergeburtstags-Menüs auf Wunsch"], kontakt: true, qr: "kindergeburtstag" },

  { typ: "promo", hoch: BILD + "32-tjorven-anton-eventflaeche-hochkant.jpeg", posHoch: "50% 22%",
    titel: "Feiern in der KLIMA ARENA", unter: "Tagsüber auf der Eventfläche oder in den Workshopräumen",
    texte: ["Geburtstagsbrunch, Familienfest oder Jubiläum in besonderem Ambiente."],
    punkte: ["Eigener Raum", "Kinder können die Ausstellung erkunden", "Catering vom Tjorven Bistro",
             "Brunch, Kaffee & Kuchen oder individuelles Catering"], qr: "catering" },

  { typ: "promo", quer: BILD + "31-tjorven-anton-bistro-quer.jpeg", text: "rechts-breit", posQuer: "50% 70%",
    titel: "Feiern im Tjorven Bistro", unter: "Abends ab 17 Uhr als geschlossene Gesellschaft",
    texte: ["Das Bistro exklusiv für Geburtstage, Vereinsfeiern oder Firmenfeiern."],
    punkte: ["Eigener Bistrobereich", "À-la-carte oder Buffet", "Wein- und Getränkeservice",
             "Auf Wunsch mit vorheriger Führung durch die KLIMA ARENA"], qr: "catering" },

  /* Zusatzinformationen (wie auf der Speisekarte) – Aufbau siehe infoSlide() */
  { typ: "info" },

  /* Zimtschnecke: steht NICHT auf der Speisekarte, daher kein bestätigter Preis.
     Erst mit bestätigtem Preis aktivieren (aktiv: true, preis eintragen). */
  { typ: "produkt", aktiv: false, quer: BILD + "06-zimtschnecken-quer.jpeg", hoch: BILD + "07-zimtschnecken-hochkant.jpeg",
    text: "rechts", name: "Zimtschnecke", preis: null }
];
const KONTAKT = ["Website: tjorven-bistro.de", "oder direkt im Bistro ansprechen"];

/* ---------- Aufbau der Slides (Text immer als Text, nie als HTML) ---------- */
function el(tag, klasse, text) {
  const e = document.createElement(tag);
  if (klasse) e.className = klasse;
  if (text !== undefined) e.textContent = text;
  return e;
}
function bild(src, klasse, pos) {
  const i = el("img", klasse);
  i.src = src;
  i.alt = "";
  if (pos) i.style.objectPosition = pos;
  return i;
}
function qrEl(schluessel) {
  const qr = QRS[schluessel];
  const q = el("div", "qr");
  const i = el("img"); i.src = qr.bild; i.alt = "QR-Code: " + qr.text;
  q.appendChild(i);
  /* Adresse unter/neben dem Code; Umbruch nur nach „/“ */
  const t = el("span");
  qr.text.split("/").forEach((teil, n) => { if (n) { t.appendChild(document.createTextNode("/")); t.appendChild(el("wbr")); } t.appendChild(document.createTextNode(teil)); });
  q.appendChild(t);
  return q;
}
function punkteEl(liste) {
  const ul = el("ul", "punkte");
  liste.forEach(t => ul.appendChild(el("li", "", t)));
  return ul;
}
/* Gleicher Inhalt für beide Formate: Titel/Name, Liste, Preis, Texte, Toppings, Punkte, Kontakt, QR */
function inhalt(s) {
  const fc = el("figcaption");
  if (Array.isArray(s.titel)) {
    /* feste Zeilen (Willkommen): je Zeile ein Block, mittig */
    const t = el("span", "titel");
    s.titel.forEach((z, n) => { if (n) t.appendChild(document.createTextNode(" ")); t.appendChild(el("span", "zeile", z)); });
    fc.appendChild(t);
  } else if (s.titel) fc.appendChild(el("span", "titel", s.titel));
  if (s.unter) fc.appendChild(el("span", "unter", s.unter));
  if (s.name) fc.appendChild(el("span", "name", s.name));
  if (s.liste) {
    const ul = el("ul", "karte");
    s.liste.forEach(([n, p, sub]) => {
      const li = el("li");
      li.appendChild(el("span", "", n)); li.appendChild(el("span", "preis", p));
      if (sub) li.appendChild(el("span", "sub", sub));
      ul.appendChild(li);
    });
    fc.appendChild(ul);
  }
  if (s.preis) fc.appendChild(el("span", "preis", s.preis));
  if (s.texte) {
    const t = el("span", "texte");
    s.texte.forEach(x => t.appendChild(el("span", "", x)));
    fc.appendChild(t);
  }
  if (s.toppings) {
    const ul = el("ul", "toppings");
    s.toppings.forEach(([n, a]) => { const li = el("li"); li.appendChild(el("span", "", n)); if (a) li.appendChild(el("span", "aufpreis", a)); ul.appendChild(li); });
    fc.appendChild(ul);
  }
  /* Punkte und QR-Code stehen nebeneinander; ohne Punkte steht der QR-Code neben dem Kontakt */
  if (s.punkte && s.qr && !s.kontakt) {
    const z = el("div", "qr-zeile"); z.appendChild(punkteEl(s.punkte)); z.appendChild(qrEl(s.qr)); fc.appendChild(z);
  } else if (s.punkte) fc.appendChild(punkteEl(s.punkte));
  if (s.kontakt) {
    const c = el("span", "cta", KONTAKT[0]);
    c.appendChild(el("br"));
    c.appendChild(document.createTextNode(KONTAKT[1]));
    if (s.qr) { const z = el("div", "qr-zeile"); z.appendChild(c); z.appendChild(qrEl(s.qr)); fc.appendChild(z); }
    else fc.appendChild(c);
  }
  return fc;
}
/* Zusatzinfo-Folie: drei Textflächen auf dem Küchenfoto (unscharf), darüber das
   blasse Tjorven-Logo; im Vollbild das Foto zusätzlich scharf in der Mitte.
   Texte wie vorgegeben bzw. wie auf der Speisekarte (Referenzbild Tilman). */
const INFO_FOTO = BILD + "34-zusatzinfos-kueche-hintergrund-hochkant.jpeg";
function infoSlide(format) {
  const f = el("figure", "slide info");
  f.appendChild(bild(INFO_FOTO, "unschaerfe"));
  f.appendChild(el("div", "schleier"));
  const logo = bild("/abholmonitor/logo-kreis.png", "info-logo"); f.appendChild(logo);
  if (format === "quer") f.appendChild(bild(INFO_FOTO, "info-foto", "50% 50%"));
  const b1 = el("div", "blob rosa linsen");
  b1.appendChild(el("h3", "", "Unsere schwäbischen Linsen"));
  b1.appendChild(el("p", "kursiv", "Sprout Power! Wir keimen unsere Hülsenfrüchte. Das erhöht die Nährstoffaufnahme, trägt zu besserer Verdaulichkeit bei, setzt B- sowie C-Vitamine frei und wertet das Eiweißprofil erheblich auf. Ein echtes regionales Superfood!"));
  const b2 = el("div", "blob gruen bohne");
  b2.appendChild(el("h3", "", "Kaffeebohne aus Speyer"));
  const p2 = el("p");
  [["Wir beziehen unsere "], ["fair", 1], [" gehandelten sowie "], ["bio", 1], [" zertifizierten Kaffeebohnen von "],
   ["Schramms Kaffeerösterei aus Speyer", 1], [". Milchgetränke servieren wir mit Hafermilch, wahlweise Sojamilch oder einer glutenfreien Alternative."]]
    .forEach(([t, fett]) => p2.appendChild(fett ? el("strong", "", t) : document.createTextNode(t)));
  b2.appendChild(p2);
  const b3 = el("div", "blob rosa koffein", "Wir bereiten dir alle Kaffeegetränke gerne auch entkoffeiniert zu!");
  [b1, b2, b3].forEach(b => { b.querySelectorAll("p").forEach(x => x.style.margin = "0"); f.appendChild(b); });
  return f;
}
function slideRahmen(s) {
  return el("figure", "slide " + s.typ + (s.rot ? " rot" : "") + (s.deckblatt ? " mit-deckblatt" : "") + (s.toppings ? " mit-toppings" : ""));
}

/* Vollbild (quer) */
function querSlide(s) {
  if (s.typ === "info") return infoSlide("quer");
  const f = slideRahmen(s);
  const fc = inhalt(s);
  if (s.quer && s.fotoSeitlich) {
    /* Produkt mittig im Foto: Foto links in voller Höhe, rechts unscharf auslaufend, Text rechts */
    f.appendChild(bild(s.quer, "unschaerfe"));
    f.appendChild(bild(s.quer, "bild-seite", s.posQuer));
    fc.classList.add("pos-" + (s.text || "rechts"));
  } else if (s.quer) {
    f.appendChild(bild(s.quer, "bild-voll", s.posQuer));
    fc.classList.add("pos-" + (s.text || "links"));
  } else if (s.deckblatt) {
    f.appendChild(bild(s.deckblatt, "unschaerfe"));
    f.appendChild(bild(s.deckblatt, "deckblatt-bild"));
    fc.classList.add("pos-deckblatt");
  } else {
    /* nur Hochkant-Foto: rechts ganz zeigen, dahinter dasselbe Bild unscharf, Text links
       (Produkte/Kaffee: hochkante Textfläche mittig im freien Bereich) */
    f.appendChild(bild(s.hoch, "unschaerfe"));
    f.appendChild(bild(s.hoch, "hoch-bild"));
    fc.classList.add(s.typ === "promo" ? "pos-split" : "pos-seite");
  }
  f.appendChild(fc);
  return f;
}

/* Spalte (hoch) */
function hochSlide(s) {
  if (s.typ === "info") return infoSlide("hoch");
  const f = slideRahmen(s);
  let foto;
  if (s.hoch) {
    foto = el("div", "foto");
    foto.appendChild(bild(s.hoch, "bild", s.posHoch));
  } else if (s.deckblatt) {
    foto = el("div", "foto deckblatt");
    foto.appendChild(bild(s.deckblatt, "bild"));
  } else {
    /* nur Querformat (Bistro-Foto): oben in voller Breite, Personen nicht angeschnitten */
    foto = el("div", "foto quer-oben");
    foto.appendChild(bild(s.quer, "bild", s.posHochQuer || s.posQuer));
  }
  f.appendChild(foto);
  f.appendChild(inhalt(s));
  return f;
}

const aktiv = slides.filter(s => s.aktiv !== false);
const vollbild = document.getElementById("vollbild");
const spalte = document.getElementById("slideshow");
aktiv.forEach(s => {
  vollbild.appendChild(querSlide(s));
  spalte.appendChild(hochSlide(s));
});

/* ---------- Diashow: ein Takt für beide Darstellungen ---------- */
const querSlides = vollbild.querySelectorAll(".slide");
const hochSlides = spalte.querySelectorAll(".slide");
let index = 0;
const duration = 9000;

function showSlide() {
  const vorher = (index - 1 + aktiv.length) % aktiv.length;
  [querSlides, hochSlides].forEach(liste => {
    liste.forEach((s, i) => {
      s.style.opacity = i === index ? "1" : "0";
      /* nur aktuelle und vorige Slide (Überblendung) zeichnen – schont den Fernseher */
      s.classList.toggle("sichtbar", i === index || i === vorher);
    });
  });

  setTimeout(() => {
    index = (index + 1) % aktiv.length;
    showSlide();
  }, duration);
}

showSlide();
</script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAobjFE0XOHUq8DLRhJf-1hfXQ7LKpKTs",
  authDomain: "abholmonitor.firebaseapp.com",
  databaseURL: "https://abholmonitor-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "abholmonitor",
  storageBucket: "abholmonitor.firebasestorage.app",
  messagingSenderId: "433360255912",
  appId: "1:433360255912:web:99823d9bd84a97d619bb9d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* Modus: mindestens eine Bestellung mit Nummer → Bestellansicht, sonst Werbung im Vollbild */
function setzeModus(anzahl) {
  const modus = anzahl > 0 ? "bestellung" : "werbung";
  if (document.body.dataset.modus !== modus) document.body.dataset.modus = modus;
}

/* Nur LESEN
   Nummer und Tier werden als Text eingesetzt (textContent), nie als HTML –
   so kann ein Eintrag in der Datenbank keinen Code auf dem Fernseher ausführen. */
db.ref("orders").on("value", snapshot => {
  const data = snapshot.val() || {};
  const prepList = document.getElementById("prepList");
  const readyList = document.getElementById("readyList");

  prepList.innerHTML = "";
  readyList.innerHTML = "";

  const entries = Object.entries(data).sort((a, b) => Number(a[1].number) - Number(b[1].number));

  entries.forEach(([id, o]) => {
    const div = document.createElement("div");
    div.className = "order " + (o.status === "prep" ? "prep" : "ready");

    const animalText = o.animal ? String(o.animal).toUpperCase() : "";

    const nummer = document.createElement("span");
    nummer.textContent = o.number;
    div.appendChild(nummer);

    if (animalText) {
      const tier = document.createElement("span");
      tier.className = "animal";
      tier.textContent = animalText;
      div.appendChild(tier);
    }

    if (o.status === "prep") prepList.appendChild(div);
    else readyList.appendChild(div);
  });

  const gueltig = Object.values(data).filter(o => o && o.number !== undefined && o.number !== null && String(o.number).trim() !== "");
  setzeModus(gueltig.length);
});
</script>
